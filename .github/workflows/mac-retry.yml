# GitHub sometimes has no Mac free: the Mac checks job is never picked up and gets marked failed without running
# a single step. That isn't a test failure, so run it again (up to 3 tries). Real failures are left alone.
name: Mac checks retry
on:
  workflow_run:
    workflows: ['Mac checks']
    types: [completed]
permissions: { actions: write }
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: '${{ github.token }}', RUN: '${{ github.event.workflow_run.id }}', REPO: '${{ github.repository }}' }
        run: |
          steps=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" -q '[.jobs[].steps | length] | add // 0')
          echo "steps that ran: $steps"
          if [ "$steps" = "0" ]; then echo "no Mac was free: trying again"; gh run rerun "$RUN" --repo "$REPO"; else echo "it really ran: leaving it"; fi
