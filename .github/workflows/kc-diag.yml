name: Keychain diag
# Does a keychain "Always Allow" survive a rebuild for an app signed with Washi's own (self-made) certificate?
# Builds a tiny keychain reader twice (different code), signs both, and checks whether v2 can read what v1 stored.
# Variants: the real Washi certificate, and a self-made one with a team id (OU) in its subject.
on: { workflow_dispatch: {} }
jobs:
  kc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        env: { WASHI_UPDATE_KEY: '${{ secrets.WASHI_UPDATE_KEY }}' }
        run: |
          set -x
          cd test/kc
          clang -DVERSION='"1"' kc.c -framework Security -o kc1
          clang -DVERSION='"2"' -DEXTRA kc.c -framework Security -o kc2 -Wl,-sectcreate,__TEXT,__v2,kc.c
          # a keychain of our own, unlocked, as the default
          KC=$RUNNER_TEMP/probe.keychain-db; security create-keychain -p pw $KC; security unlock-keychain -p pw $KC; security set-keychain-settings $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"'); security default-keychain -s $KC
          # 1) Washi's certificate
          P=$(node ../../scripts/signing-identity.js open $RUNNER_TEMP/w.p12)
          security import $RUNNER_TEMP/w.p12 -k $KC -P "$P" -T /usr/bin/codesign >/dev/null
          # 2) a self-made one with a team id in its subject
          openssl req -x509 -newkey rsa:2048 -nodes -keyout t.key -out t.crt -days 3650 -subj "/CN=Washi Team Test/OU=WASHI12345/O=Colton Craig" -addext "keyUsage=critical,digitalSignature" -addext "extendedKeyUsage=critical,codeSigning"
          openssl pkcs12 -export -legacy -inkey t.key -in t.crt -out t.p12 -passout pass:pw || openssl pkcs12 -export -inkey t.key -in t.crt -out t.p12 -passout pass:pw
          security import t.p12 -k $KC -P pw -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k pw $KC >/dev/null
          security find-identity -p codesigning $KC
          for ID in "Washi (Colton Craig)" "Washi Team Test"; do
            echo "=========== $ID"
            H=$(security find-identity -p codesigning $KC | awk -v n="$ID" 'index($0, n) {print $2; exit}')
            cp kc1 a1; cp kc2 a2
            codesign -f -s "$H" --keychain $KC -i com.coltoncraig.washi.kcprobe a1; codesign -f -s "$H" --keychain $KC -i com.coltoncraig.washi.kcprobe a2
            codesign -dvvv a1 2>&1 | grep -E "TeamIdentifier|CDHash=|Authority"; codesign -dvvv a2 2>&1 | grep -E "TeamIdentifier|CDHash="
            security delete-generic-password -s washi-kc-probe $KC >/dev/null 2>&1 || true
            ./a1 create; ./a1 read; ./a2 read || true
            security dump-keychain -a $KC 2>/dev/null | grep -A30 'washi-kc-probe' | grep -iE "partition|teamid|cdhash|description" | head -8
            # the same build, re-signed (what a release does to unchanged code)
            cp kc1 a1b; codesign -f -s "$H" --keychain $KC -i com.coltoncraig.washi.kcprobe a1b; codesign -dvvv a1b 2>&1 | grep CDHash=; ./a1b read || true
          done
