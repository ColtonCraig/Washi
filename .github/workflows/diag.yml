# On demand: install a real extension from the Chrome Web Store on GitHub's Mac and record what goes wrong
# (test/diag-ext.js). Run: gh workflow run diag.yml -f ext=<extension id>
name: Extension diagnosis
on:
  workflow_dispatch:
    inputs:
      ext: { description: 'Chrome Web Store extension id', required: true, default: 'glnpjglilkicbckjpbgcfkogebgllemb' }
      look: { description: 'code to show from the extension, | separated', required: false, default: '' }
      runner: { description: 'macos-latest (Apple silicon) or macos-15-intel (often free sooner)', required: true, default: 'macos-15-intel' }
jobs:
  diag:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm i --no-save playwright@1
      - run: EXT_ID=${{ inputs.ext }} EXT_LOOK='${{ inputs.look }}' WASHI_SHOTS=$RUNNER_TEMP node test/diag-ext.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag, path: '${{ runner.temp }}/*.png', if-no-files-found: ignore }
