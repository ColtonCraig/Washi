# On demand: install a real extension from the Chrome Web Store on GitHub's Mac and record what goes wrong
# (test/diag-ext.js). Run: gh workflow run diag.yml -f ext=<extension id>
name: Extension diagnosis
on:
  workflow_dispatch:
    inputs:
      ext: { description: 'Chrome Web Store extension id', required: true, default: 'glnpjglilkicbckjpbgcfkogebgllemb' }
jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm i --no-save playwright@1
      - run: EXT_ID=${{ inputs.ext }} WASHI_SHOTS=$RUNNER_TEMP node test/diag-ext.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag, path: '${{ runner.temp }}/*.png', if-no-files-found: ignore }
