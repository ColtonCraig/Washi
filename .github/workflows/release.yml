# Builds Washi for Apple silicon and Intel Macs whenever the `release` branch is pushed (with a new version in
# package.json), and publishes it to the public washi-releases repository. Installed copies of Washi see the new latest.json and update themselves.
# Secrets (Settings → Secrets and variables → Actions):
#   WASHI_UPDATE_KEY  private release key (signs latest.json; its public half is app/update-key.pub)
#   RELEASES_TOKEN    fine-grained token with "Contents: read and write" on the washi-releases repository only
# Variable: RELEASES_REPO  e.g. yourname/washi-releases
name: Release
on:
  push:
    branches: [release]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Skip if this version is already published
        id: v
        env: { GH_TOKEN: '${{ secrets.RELEASES_TOKEN || secrets.RELEASE_TOKEN }}', REPO: "${{ vars.RELEASES_REPO || 'ColtonCraig/Washi-releases' }}" }
        run: |
          V=$(node -p 'require("./package.json").version'); echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$REPO" >/dev/null 2>&1; then echo "v$V is already out"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
        if: steps.v.outputs.skip != '1'
      - run: npm run lists
        if: steps.v.outputs.skip != '1'                       # fresh blocklists baked into this release
      - name: Build both Macs
        if: steps.v.outputs.skip != '1'
        run: |
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --arm64 -c.mac.identity=null
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --x64 -c.mac.identity=null
      - name: Sign (with Washi's own certificate), zip, and make the installer disk image
        if: steps.v.outputs.skip != '1'
        env: { WASHI_UPDATE_KEY: '${{ secrets.WASHI_UPDATE_KEY }}' }
        run: |
          V=$(node -p 'require("./package.json").version'); mkdir -p out
          for A in arm64 x64; do
            L=$([ "$A" = x64 ] && echo x86_64 || echo arm64)
            APP=$(ls -d dist/mac*/Washi.app | while read d; do lipo -archs "$d/Contents/MacOS/Washi" | grep -qw "$L" && echo "$d"; done | head -1)
            test -n "$APP"
            scripts/sign-mac.sh "$APP"
            ditto -c -k --keepParent "$APP" "out/Washi-$V-$A.zip"
            scripts/make-dmg.sh "$APP" "out/Washi-$V-$A.dmg"
            M=$(hdiutil attach -nobrowse -readonly "out/Washi-$V-$A.dmg" | awk -F'\t' '/Volumes/ {print $NF}')
            ls -la "$M"; test -f "$M/.DS_Store"; test -f "$M/.background/background.tiff"; test -d "$M/Washi.app"; test -L "$M/Applications"
            hdiutil detach "$M"
          done
      - name: Sign the update info
        if: steps.v.outputs.skip != '1'
        env: { WASHI_UPDATE_KEY: '${{ secrets.WASHI_UPDATE_KEY }}' }
        run: |
          V=$(node -p 'require("./package.json").version')
          node scripts/release-manifest.js "$V" out "out/Washi-$V-arm64.zip" "out/Washi-$V-x64.zip" "$(git log -1 --format=%s)"
      - name: Publish to washi-releases
        if: steps.v.outputs.skip != '1'
        env: { GH_TOKEN: '${{ secrets.RELEASES_TOKEN || secrets.RELEASE_TOKEN }}', REPO: "${{ vars.RELEASES_REPO || 'ColtonCraig/Washi-releases' }}" }
        run: |
          V=$(node -p 'require("./package.json").version')
          gh release create "v$V" out/* --repo "$REPO" --title "Washi $V" --notes "Download Washi-$V-arm64.dmg for Apple silicon Macs (M1 and newer) or Washi-$V-x64.dmg for Intel Macs."
