# Things that behave differently on a real Mac: the importer (Apple's ditto for Safari zips, Electron's built-in SQLite),
# and saved passwords + passkeys (the real Keychain via safeStorage, the macOS WebAuthn path).
name: Mac checks
# Mac minutes cost ~10x Linux minutes, so these run when asked (before a release that changes Mac-specific code):
#   gh workflow run macchecks.yml   (or: gh api -X POST repos/ColtonCraig/Washi/actions/workflows/macchecks.yml/dispatches -f ref=main)
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sw_vers
      - run: npm ci && npm i --no-save playwright@1
      - run: ELECTRON_RUN_AS_NODE=1 npx electron test/mac-import.js
      - name: Passwords and passkeys
        run: |
          node test/server.js > server.log 2>&1 &
          for i in $(seq 1 100); do curl -s -o /dev/null http://localhost:8765/p1.html && break; sleep 0.2; done
          WASHI_DEBUG_PW=1 node test/mac-passwords.js
      - name: Extensions (sandboxed, real Chrome Web Store)
        run: |
          node test/server.js > server2.log 2>&1 &
          for i in $(seq 1 100); do curl -s -o /dev/null http://localhost:8765/p1.html && break; sleep 0.2; done
          WASHI_SHOTS=$RUNNER_TEMP node test/mac-extensions.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: mac-screenshots, path: '${{ runner.temp }}/*.png', if-no-files-found: ignore }
