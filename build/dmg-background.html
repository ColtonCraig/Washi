<!-- The installer window art (680x440). Re-render: open in a browser at 1x and 2x and save as dmg-background.png / dmg-background@2x.png. Icons sit at (180,224) and (500,224); see dmg-settings.py. -->
<!doctype html><html><head><style>
@font-face{font-family:Caveat;src:url(../ui/fonts/caveat.woff2)}@font-face{font-family:Figtree;src:url(../ui/fonts/figtree.woff2);font-weight:300 900}
*{box-sizing:border-box;margin:0}
html,body{width:680px;height:440px;overflow:hidden}
body{position:relative;background:#fdd3ae;font-family:Figtree}
.grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply}
.sheet{position:absolute;left:34px;top:30px;width:612px;height:384px;background:#fbf6ea;border-radius:6px;transform:rotate(-.8deg);
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px rgba(120,60,20,.18),0 2px 4px rgba(120,60,20,.12)}
.tape{position:absolute;height:30px;opacity:.93;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tape{clip-path:polygon(0 0,100% 0,97% 18%,100% 36%,96% 55%,100% 72%,97% 88%,100% 100%,0 100%,3% 84%,0 66%,4% 48%,0 30%,3% 14%)}
.coral{background:repeating-linear-gradient(-45deg,#ff6a3d 0 9px,#ffa784 9px 18px)}
.blue{background:repeating-linear-gradient(-45deg,#3d63ff 0 9px,#86a0ff 9px 18px)}
.mint{background:repeating-linear-gradient(-45deg,#3fbf9c 0 9px,#8fe0c8 9px 18px)}
h1{position:absolute;left:0;right:0;top:58px;text-align:center;font:700 44px/1 Caveat;color:#2b2118;letter-spacing:.3px}
.sub{position:absolute;left:0;right:0;top:110px;text-align:center;font:500 14.5px Figtree;color:#6b5d4f}
.slot{position:absolute;width:150px;height:136px;border-radius:26px;border:2.5px dashed rgba(43,33,24,.22)}
.lbl{position:absolute;width:118px;height:24px;border-radius:3px}
.note{position:absolute;left:204px;top:338px;width:272px;padding:9px 14px 10px;background:#fff1a8;transform:rotate(1.2deg);font:500 11.5px/1.35 Figtree;color:#5b4a2c;
  box-shadow:0 4px 10px rgba(120,80,0,.15);border-radius:2px}
.note b{font-weight:700;color:#3e3018}
.hand{position:absolute;font:700 23px Caveat;color:#ff6a3d}
.dot{position:absolute;border-radius:50%}
</style></head><body>
<svg class="grain" width="680" height="440"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .35 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="dot" style="left:-60px;top:290px;width:190px;height:190px;background:#ffd84d;opacity:.55"></div>
<div class="dot" style="left:580px;top:-50px;width:150px;height:150px;background:#cbd9f6;opacity:.9;border-radius:18px;transform:rotate(14deg)"></div>
<div class="sheet"></div>
<div class="tape coral" style="left:84px;top:18px;width:120px;transform:rotate(-6deg)"></div>
<div class="tape blue" style="left:500px;top:22px;width:104px;transform:rotate(5deg)"></div>
<div class="tape mint" style="left:560px;top:380px;width:96px;transform:rotate(-8deg)"></div>
<h1>Hi! Let's tape Washi in.</h1>
<p class="sub">Drag the scrap onto your Applications folder.</p>
<!-- icon spots: Washi at (180,224), Applications at (500,224) in Finder coordinates -->
<div class="slot" style="left:105px;top:149px;border-color:rgba(255,106,61,.45);background:rgba(255,106,61,.05)"></div>
<div class="slot" style="left:425px;top:149px"></div>
<div class="lbl" style="left:121px;top:290px;background:rgba(255,106,61,.85);transform:rotate(-1.5deg)"></div>
<div class="lbl" style="left:441px;top:290px;background:rgba(61,99,255,.75);transform:rotate(1.2deg)"></div>
<svg style="position:absolute;left:258px;top:168px" width="170" height="80" viewBox="0 0 170 80" fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 58 C 45 8, 115 4, 150 44" stroke-dasharray="2 9"/><path d="M134 42 L151 46 L152 28"/></svg>
<div class="hand" style="left:290px;top:236px;transform:rotate(-4deg)">drag me over!</div>
<div class="note"><b>First time opening it?</b> If macOS says it can't check Washi, open System&nbsp;Settings › Privacy &amp; Security and click <b>Open Anyway</b>. Just once.</div>
</body></html>
